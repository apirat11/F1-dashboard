const days=["Mon","Tue","Wed","Thu","Fri"];
const names={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
let selected="ALL";
const buttons=document.getElementById("buttons");
["ALL",...days].forEach(d=>{let b=document.createElement("button");b.textContent=d==="ALL"?"All Days":names[d];b.onclick=()=>{selected=d;render()};b.dataset.d=d;buttons.appendChild(b)});

function series(day){
 const out=[];
 for(let m=420;m<=1080;m+=15){
  let time=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  let a=raw.filter(x=>x.day===day&&x.time===time);
  out.push({time,total:a.reduce((s,x)=>s+x.power,0)/1000,courses:a});
 }
 return out;
}
function render(){
 document.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.d===selected));
 let ds=selected==="ALL"?days:[selected], traces=[];
 ds.forEach(d=>{let s=series(d);traces.push({x:s.map(x=>x.time),y:s.map(x=>x.total),mode:"lines+markers",name:names[d],
 customdata:s.map(x=>[x.courses.map(c=>c.code+" — "+c.phase+" — "+(c.power/1000).toFixed(3)+" kW").join("<br>")]),
 hovertemplate:"<b>"+names[d]+"</b><br>Time: %{x}<br>Total Power: %{y:.3f} kW<br>%{customdata[0]}<extra></extra>"})}); 
 Plotly.react("chart",traces,{template:"plotly_white",title:"F1 Electricity Demand",xaxis_title:"Time",yaxis_title:"Total Power (kW)",hovermode:"x unified",margin:{l:60,r:20,t:55,b:60}},{responsive:true});
 let ph="";
 ds.forEach(d=>{let s=series(d),nz=s.filter(x=>x.total>0);if(!nz.length){ph+="<p>"+names[d]+": 0 kW</p>";return}
 let p=nz.reduce((a,b)=>b.total>a.total?b:a);ph+="<p><b>"+names[d]+"</b>: "+p.total.toFixed(5)+" kW at "+p.time+" — "+p.courses.map(c=>c.code+" ("+c.phase+")").join(", ")+"</p>";});
 document.getElementById("peaks").innerHTML=ph;
 let d=selected==="ALL"?"Tue":selected,s=series(d),nz=s.filter(x=>x.total>0);
 if(!nz.length){document.getElementById("details").innerHTML="<p>No active courses.</p>";return}
 let p=nz.reduce((a,b)=>b.total>a.total?b:a);
 document.getElementById("details").innerHTML="<p><b>"+names[d]+" "+p.time+" — "+p.total.toFixed(5)+" kW</b></p><table><tr><th>Course</th><th>Phase</th><th>Power Used</th><th>Base</th><th>Peak</th></tr>"+
 p.courses.map(c=>"<tr><td>"+c.code+"<br>"+c.name+"</td><td><span class='badge'>"+c.phase+"</span></td><td>"+c.power.toFixed(2)+" W</td><td>"+c.base.toFixed(2)+" W</td><td>"+c.peak.toFixed(2)+" W</td></tr>").join("")+"</table>";
}
render();
